[project]
name = "horas-jira"
version = "0.1.0"
description = "Genera un Excel con las horas cargadas por el equipo en Jira Cloud"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "tzdata>=2024.1",
]

[project.scripts]
horas-jira = "horas_jira.main:main"
cargar-horas = "horas_jira.cli_carga:main"
crear-tareas = "horas_jira.cli_tareas:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
